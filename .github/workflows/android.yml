name: Android CI

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    if: ${{ (github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.build_type == 'debug') }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Check formatting and run tests
      run: ./gradlew lintKotlin test

    - name: Build mini debug
      run: ./gradlew assembleMiniDebug

    - name: Archive artifacts
      uses: actions/upload-artifact@v7
      with:
        name: outputs-apk-minidebug-${{ github.event_name == 'workflow_dispatch' && github.run_number || github.ref_name }}
        path: app/build/outputs/apk/miniDebug
        if-no-files-found: error

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release') }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Restore release keystore
      env:
        SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      run: |
        set -euo pipefail
        test -n "$SIGNING_KEYSTORE_BASE64"
        test -n "$SIGNING_STORE_PASSWORD"
        test -n "$SIGNING_KEY_ALIAS"
        test -n "$SIGNING_KEY_PASSWORD"

        mkdir -p .sign
        printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dsu-sideloader-release.jks"
        chmod 600 "$RUNNER_TEMP/dsu-sideloader-release.jks"

        {
          printf 'keystore=%s\n' "$RUNNER_TEMP/dsu-sideloader-release.jks"
          printf 'keystore_pw=%s\n' "$SIGNING_STORE_PASSWORD"
          printf 'alias=%s\n' "$SIGNING_KEY_ALIAS"
          printf 'alias_pw=%s\n' "$SIGNING_KEY_PASSWORD"
        } > .sign/dsu_sideloader.prop
        chmod 600 .sign/dsu_sideloader.prop

    - name: Build signed release APK
      run: ./gradlew assembleRelease

    - name: Verify APK signature
      run: |
        set -euo pipefail
        APK="app/build/outputs/apk/release/app-release.apk"
        APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
        test -n "$APKSIGNER"
        "$APKSIGNER" verify --verbose "$APK"

    - name: Archive signed release APK
      uses: actions/upload-artifact@v7
      with:
        name: dsu-sideloader-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_number) || github.ref_name }}
        path: app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
        retention-days: 30
